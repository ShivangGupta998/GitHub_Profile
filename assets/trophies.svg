<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 120" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
      .trophy-card { fill: #161B22; stroke: #30363D; stroke-width: 1.2; rx: 8; transition: all 0.25s ease; }
      .trophy-card:hover { fill: #1C2128; stroke: #38BDF8; }
      .trophy-title { fill: #F0F6FC; font-size: 11px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
      .trophy-sub { fill: #8B949E; font-size: 9.5px; font-weight: 500; font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Container Row of 6 Trophies -->
  <g transform="translate(10, 10)">
    <!-- Trophy 1: Full-Stack Architect -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="146" height="100" class="trophy-card"/>
      <circle cx="73" cy="32" r="18" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="73" y="38" text-anchor="middle" font-size="18">🌐</text>
      <text x="73" y="68" text-anchor="middle" class="trophy-title">Full-Stack Dev</text>
      <text x="73" y="84" text-anchor="middle" class="trophy-sub">React • Next • TS</text>
    </g>

    <!-- Trophy 2: Modern Frontend -->
    <g transform="translate(158, 0)">
      <rect x="0" y="0" width="146" height="100" class="trophy-card"/>
      <circle cx="73" cy="32" r="18" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="73" y="38" text-anchor="middle" font-size="18">⚛️</text>
      <text x="73" y="68" text-anchor="middle" class="trophy-title">Modern Frontend</text>
      <text x="73" y="84" text-anchor="middle" class="trophy-sub">UI/UX • Tailwind</text>
    </g>

    <!-- Trophy 3: Backend & Systems -->
    <g transform="translate(316, 0)">
      <rect x="0" y="0" width="146" height="100" class="trophy-card"/>
      <circle cx="73" cy="32" r="18" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="73" y="38" text-anchor="middle" font-size="18">🚀</text>
      <text x="73" y="68" text-anchor="middle" class="trophy-title">Backend &amp; APIs</text>
      <text x="73" y="84" text-anchor="middle" class="trophy-sub">Node • Python • REST</text>
    </g>

    <!-- Trophy 4: CI/CD Pipeline -->
    <g transform="translate(474, 0)">
      <rect x="0" y="0" width="146" height="100" class="trophy-card"/>
      <circle cx="73" cy="32" r="18" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="73" y="38" text-anchor="middle" font-size="18">⚡</text>
      <text x="73" y="68" text-anchor="middle" class="trophy-title">CI/CD Automation</text>
      <text x="73" y="84" text-anchor="middle" class="trophy-sub">GitHub Actions • CI</text>
    </g>

    <!-- Trophy 5: Databases & Cloud -->
    <g transform="translate(632, 0)">
      <rect x="0" y="0" width="146" height="100" class="trophy-card"/>
      <circle cx="73" cy="32" r="18" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="73" y="38" text-anchor="middle" font-size="18">💾</text>
      <text x="73" y="68" text-anchor="middle" class="trophy-title">Cloud &amp; Database</text>
      <text x="73" y="84" text-anchor="middle" class="trophy-sub">Postgres • Docker • AWS</text>
    </g>

    <!-- Trophy 6: Commit Activity -->
    <g transform="translate(790, 0)">
      <rect x="0" y="0" width="146" height="100" class="trophy-card"/>
      <circle cx="73" cy="32" r="18" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
      <text x="73" y="38" text-anchor="middle" font-size="18">🏆</text>
      <text x="73" y="68" text-anchor="middle" class="trophy-title">Active Contributor</text>
      <text x="73" y="84" text-anchor="middle" class="trophy-sub">200+ Contributions</text>
    </g>
  </g>
</svg>
