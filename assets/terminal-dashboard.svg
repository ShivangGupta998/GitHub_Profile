<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 336" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-block { animation: blinkCursor 1s infinite steps(1); }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="574" height="336" fill="#FFFFFF"/>

  <!-- ==================== SECTION 1: WHOAMI ==================== -->
  <g transform="translate(16, 20)">
    <!-- Command Prompt & Status -->
    <text x="0" y="0" fill="#111111" font-size="11" font-weight="700" class="font-mono">shivang@dev:~$ whoami</text>
    <text x="542" y="0" text-anchor="end" fill="#10B981" font-size="10.5" font-weight="600" class="font-mono">[ ONLINE ● ]</text>

    <!-- Hi, I'm -->
    <text x="0" y="26" fill="#888888" font-size="18" font-weight="800" letter-spacing="-0.5" class="font-sans">Hi, I'm</text>

    <!-- Name & Cursor Block -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" fill="#111111" font-size="26" font-weight="900" letter-spacing="1.2" class="font-sans">SHIVANG GUPTA</text>
      <!-- Solid Black Cursor Block -->
      <rect x="236" y="-21" width="12" height="24" fill="#111111" class="cursor-block"/>
    </g>

    <!-- Tagline Subtitle -->
    <text x="0" y="72" fill="#444444" font-size="11" font-weight="500" class="font-mono">DevOps Engineer  |  AWS &amp; Kubernetes  |  CI/CD &amp; Cloud Infrastructure</text>
  </g>

  <!-- Horizontal Divider 1 -->
  <line x1="16" y1="102" x2="558" y2="102" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ==================== SECTION 2: STATS ==================== -->
  <g transform="translate(16, 120)">
    <!-- Command Prompt & Tag -->
    <text x="0" y="0" fill="#111111" font-size="11" font-weight="700" class="font-mono">shivang@dev:~$ ./stats</text>
    <text x="542" y="0" text-anchor="end" fill="#888888" font-size="9.5" font-weight="600" class="font-mono">[ GITHUB STATS ]</text>

    <!-- 4 Statistic Cards (Row) -->
    <g transform="translate(0, 10)">
      <!-- Card 1: Repos -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="126" height="44" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <rect x="12" y="14" width="15" height="13" rx="2" fill="none" stroke="#222222" stroke-width="1.3"/>
        <line x1="12" y1="18" x2="27" y2="18" stroke="#222222" stroke-width="1.3"/>
        <text x="38" y="23" fill="#111111" font-size="14" font-weight="800" class="font-sans">14</text>
        <text x="38" y="35" fill="#666666" font-size="9" font-weight="600" class="font-sans">Public Repos</text>
      </g>

      <!-- Card 2: Stars -->
      <g transform="translate(136, 0)">
        <rect x="0" y="0" width="126" height="44" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <polygon points="20,13 22,18 27,18 23,21 24,26 20,23 16,26 17,21 13,18 18,18" fill="none" stroke="#222222" stroke-width="1.3"/>
        <text x="38" y="23" fill="#111111" font-size="14" font-weight="800" class="font-sans">5+</text>
        <text x="38" y="35" fill="#666666" font-size="9" font-weight="600" class="font-sans">Total Stars</text>
      </g>

      <!-- Card 3: Contributions -->
      <g transform="translate(272, 0)">
        <rect x="0" y="0" width="134" height="44" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <circle cx="16" cy="16" r="2.2" fill="#222222"/>
        <circle cx="24" cy="16" r="2.2" fill="#222222"/>
        <circle cx="20" cy="26" r="2.2" fill="#222222"/>
        <path d="M 16 18 C 16 22 20 22 20 24 M 24 18 C 24 22 20 22 20 24" fill="none" stroke="#222222" stroke-width="1.3"/>
        <text x="38" y="23" fill="#111111" font-size="14" font-weight="800" class="font-sans">200+</text>
        <text x="38" y="35" fill="#666666" font-size="8.5" font-weight="600" class="font-sans">Contributions</text>
      </g>

      <!-- Card 4: Experience -->
      <g transform="translate(416, 0)">
        <rect x="0" y="0" width="126" height="44" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <circle cx="18" cy="18" r="3" fill="none" stroke="#222222" stroke-width="1.3"/>
        <path d="M 12 28 C 12 23 24 23 24 28" fill="none" stroke="#222222" stroke-width="1.3"/>
        <text x="36" y="23" fill="#111111" font-size="14" font-weight="800" class="font-sans">2+ Yrs</text>
        <text x="36" y="35" fill="#666666" font-size="9" font-weight="600" class="font-sans">Experience</text>
      </g>
    </g>
  </g>

  <!-- Horizontal Divider 2 -->
  <line x1="16" y1="184" x2="558" y2="184" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ==================== SECTION 3: TECH STACK ==================== -->
  <g transform="translate(16, 202)">
    <!-- Command Prompt & Tag -->
    <text x="0" y="0" fill="#111111" font-size="11" font-weight="700" class="font-mono">shivang@dev:~$ cat skills.txt</text>
    <text x="542" y="0" text-anchor="end" fill="#888888" font-size="9.5" font-weight="600" class="font-mono">[ TECH STACK ]</text>

    <!-- 6 Tech Stack Pills Row -->
    <g transform="translate(0, 10)">
      <!-- Pill 1: AWS -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="76" height="32" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <text x="9" y="19.5" fill="#111111" font-size="9" font-weight="800" class="font-mono">aws</text>
        <text x="34" y="20" fill="#111111" font-size="10" font-weight="700" class="font-sans">AWS</text>
      </g>

      <!-- Pill 2: Docker -->
      <g transform="translate(84, 0)">
        <rect x="0" y="0" width="82" height="32" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <text x="8" y="20" font-size="12">🐳</text>
        <text x="26" y="20" fill="#111111" font-size="10" font-weight="700" class="font-sans">Docker</text>
      </g>

      <!-- Pill 3: Kubernetes -->
      <g transform="translate(174, 0)">
        <rect x="0" y="0" width="94" height="32" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <rect x="10" y="9" width="13" height="13" rx="2" fill="#326CE5"/>
        <text x="11.5" y="19" fill="#FFFFFF" font-size="8" font-weight="800" class="font-mono">k8</text>
        <text x="28" y="20" fill="#111111" font-size="10" font-weight="700" class="font-sans">Kubernetes</text>
      </g>

      <!-- Pill 4: Terraform -->
      <g transform="translate(276, 0)">
        <rect x="0" y="0" width="92" height="32" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <text x="9" y="20" font-size="11">⬢</text>
        <text x="24" y="20" fill="#111111" font-size="9.5" font-weight="700" class="font-sans">Terraform</text>
      </g>

      <!-- Pill 5: Jenkins -->
      <g transform="translate(376, 0)">
        <rect x="0" y="0" width="84" height="32" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <text x="9" y="20" font-size="12">⚡</text>
        <text x="27" y="20" fill="#111111" font-size="10" font-weight="700" class="font-sans">Jenkins</text>
      </g>

      <!-- Pill 6: Python -->
      <g transform="translate(468, 0)">
        <rect x="0" y="0" width="76" height="32" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <text x="8" y="20" font-size="12">🐍</text>
        <text x="26" y="20" fill="#111111" font-size="10" font-weight="700" class="font-sans">Python</text>
      </g>
    </g>
  </g>

  <!-- Horizontal Divider 3 -->
  <line x1="16" y1="256" x2="558" y2="256" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ==================== SECTION 4: CONNECT ==================== -->
  <g transform="translate(16, 274)">
    <!-- Command Prompt & Tag -->
    <text x="0" y="0" fill="#111111" font-size="11" font-weight="700" class="font-mono">shivang@dev:~$ ./connect</text>
    <text x="542" y="0" text-anchor="end" fill="#888888" font-size="9.5" font-weight="600" class="font-mono">[ CONNECT ]</text>

    <!-- Row of 4 Buttons -->
    <g transform="translate(0, 10)">
      <!-- Button 1: GITHUB -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="94" height="34" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <circle cx="17" cy="17" r="6" fill="#111111"/>
        <text x="30" y="21" fill="#111111" font-size="9.5" font-weight="700" class="font-sans">GITHUB</text>
      </g>

      <!-- Button 2: LINKEDIN -->
      <g transform="translate(102, 0)">
        <rect x="0" y="0" width="106" height="34" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <rect x="12" y="10" width="13" height="13" rx="2" fill="#0077B5"/>
        <text x="13.5" y="20.5" fill="#FFFFFF" font-size="8.5" font-weight="800" class="font-mono">in</text>
        <text x="31" y="21" fill="#111111" font-size="9.5" font-weight="700" class="font-sans">LINKEDIN</text>
      </g>

      <!-- Button 3: EMAIL -->
      <g transform="translate(216, 0)">
        <rect x="0" y="0" width="92" height="34" rx="5" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
        <rect x="12" y="11" width="13" height="11" rx="2" fill="none" stroke="#111111" stroke-width="1.1"/>
        <polyline points="12,12 18.5,17 25,12" fill="none" stroke="#111111" stroke-width="1.1"/>
        <text x="32" y="21" fill="#111111" font-size="9.5" font-weight="700" class="font-sans">EMAIL</text>
      </g>

      <!-- Button 4: Solid Black CTA Button -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="226" height="34" rx="5" fill="#111111"/>
        <text x="18" y="21" fill="#FFFFFF" font-size="9.5" font-weight="700" class="font-mono">&gt;_ LIVE PORTFOLIO →</text>
      </g>
    </g>
  </g>
</svg>
