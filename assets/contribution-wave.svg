<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      .sub-text { fill: #8B949E; font-size: 11.5px; font-weight: 500; font-family: 'JetBrains Mono', monospace; }
      .val-text { fill: #E6EDF3; font-size: 12px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
    </style>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="958" height="198" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Left Details Panel -->
  <g transform="translate(30, 26)">
    <!-- Header -->
    <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="800" class="font-sans">ShivangGupta998 <tspan fill="#8B949E" font-size="13" font-weight="500">(Shivang Gupta)</tspan></text>
    <text x="0" y="20" fill="#38BDF8" font-size="11" font-weight="600" class="font-mono">DevOps Engineer @ DATAEKO.AI | AWS • K8s • Terraform</text>

    <!-- 4 Stats List Items -->
    <g transform="translate(0, 48)">
      <!-- Contributions -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="3" fill="#38BDF8"/>
        <text x="18" y="10" class="sub-text">contributions on GitHub:</text>
        <text x="210" y="10" class="val-text" fill="#38BDF8">200+ commits &amp; PRs</text>
      </g>
      <!-- Experience -->
      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="3" fill="#818CF8"/>
        <text x="18" y="10" class="sub-text">industry experience:</text>
        <text x="210" y="10" class="val-text">2+ Years (DevOps &amp; QA)</text>
      </g>
      <!-- Location / Timezone -->
      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="3" fill="#34D399"/>
        <text x="18" y="10" class="sub-text">timezone &amp; location:</text>
        <text x="210" y="10" class="val-text">Indore / Hyderabad (UTC+5:30)</text>
      </g>
      <!-- Email -->
      <g transform="translate(0, 72)">
        <circle cx="6" cy="6" r="3" fill="#FBBF24"/>
        <text x="18" y="10" class="sub-text">verified developer email:</text>
        <text x="210" y="10" class="val-text">shivanggupta998@gmail.com</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="440" y1="20" x2="440" y2="180" stroke="#21262D" stroke-width="1"/>

  <!-- Right Smooth Wave Chart -->
  <g transform="translate(470, 24)">
    <text x="440" y="8" text-anchor="end" fill="#8B949E" font-size="10.5" font-weight="600" class="font-mono">contributions in the last year</text>

    <!-- Wave Graphic -->
    <line x1="20" y1="40" x2="450" y2="40" stroke="#161B22" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="80" x2="450" y2="80" stroke="#161B22" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="120" x2="450" y2="120" stroke="#21262D" stroke-width="1"/>

    <!-- Filled Area Path -->
    <path d="M 20 120 
             C 60 120, 80 115, 120 112 
             C 160 108, 180 118, 220 105 
             C 260 92, 290 102, 330 75 
             C 360 55, 380 15, 400 20 
             C 415 25, 430 85, 450 120 
             Z" fill="url(#waveFill)"/>

    <!-- Wave Top Glowing Stroke -->
    <path d="M 20 120 
             C 60 120, 80 115, 120 112 
             C 160 108, 180 118, 220 105 
             C 260 92, 290 102, 330 75 
             C 360 55, 380 15, 400 20 
             C 415 25, 430 85, 450 120" fill="none" stroke="url(#waveStroke)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Peak Indicator Dot -->
    <circle cx="400" cy="20" r="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="400" y="12" text-anchor="middle" fill="#38BDF8" font-size="9" font-weight="800" class="font-mono">PEAK</text>

    <!-- Timeline Labels -->
    <g transform="translate(20, 138)" fill="#64748B" font-size="9.5" font-family="'JetBrains Mono', monospace">
      <text x="0" y="0">Oct</text>
      <text x="70" y="0">Dec</text>
      <text x="140" y="0">Feb</text>
      <text x="210" y="0">Apr</text>
      <text x="280" y="0">Jun</text>
      <text x="350" y="0">Aug</text>
      <text x="420" y="0">Oct</text>
    </g>
  </g>
</svg>
