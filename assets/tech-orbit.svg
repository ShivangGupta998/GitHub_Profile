<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      .orbit-ring { fill: none; stroke: #30363D; stroke-width: 1.2; stroke-dasharray: 6 6; }
      
      /* Interactive Hover Effects */
      .cat-badge {
        rx: 5;
        fill: #161B22;
        stroke: #30363D;
        stroke-width: 1.2;
        transition: all 0.25s ease-in-out;
      }
      .cat-text {
        fill: #E2E8F0;
        font-size: 11px;
        font-weight: 600;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        transition: fill 0.25s ease-in-out;
        pointer-events: none;
      }
      .cat-group {
        cursor: pointer;
      }
      .cat-group:hover .cat-badge {
        fill: #1E2430;
        stroke: #38BDF8;
        stroke-width: 1.6;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
      }
      .cat-group:hover .cat-text {
        fill: #FFFFFF;
        font-weight: 800;
      }
      
      /* Hover on planet nodes */
      .planet-node {
        cursor: pointer;
      }
      .planet-node:hover circle {
        fill: #1E293B;
        stroke: #FFFFFF;
        stroke-width: 2.2;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
      }
    </style>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="958" height="398" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- ==================== LEFT: LIVE ANIMATED PLANETARY ORBITS ==================== -->
  <g transform="translate(0, 0)">
    <!-- Pulsing Ambient Radial Halo -->
    <circle cx="210" cy="200" r="145" fill="url(#coreGlow)">
      <animate attributeName="r" values="135;160;135" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit Track 1 (Inner: radius 90) -->
    <circle cx="210" cy="200" r="90" class="orbit-ring">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit Track 2 (Middle: tilted -28°) -->
    <ellipse cx="210" cy="200" rx="138" ry="85" class="orbit-ring" transform="rotate(-28 210 200)">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbit Track 3 (Outer: tilted 36°) -->
    <ellipse cx="210" cy="200" rx="165" ry="95" class="orbit-ring" transform="rotate(36 210 200)">
      <animate attributeName="stroke-dashoffset" from="0" to="64" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbit Track 4 (Great Outer Sphere: radius 180) -->
    <circle cx="210" cy="200" r="180" class="orbit-ring" stroke="#21262D">
      <animate attributeName="stroke-dashoffset" from="64" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Central Glowing Core < / > with Pulsing Effect -->
    <circle cx="210" cy="200" r="38" fill="url(#coreGrad)" stroke="#BAE6FD" stroke-width="1.8" filter="url(#neonGlow)">
      <animate attributeName="r" values="37;42;37" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="210" y="207" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="900" class="font-mono">&lt; / &gt;</text>

    <!-- ==================== ROTATING ORBIT 1 (INNER - 20s CW) ==================== -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 210 200" to="360 210 200" dur="20s" repeatCount="indefinite"/>

      <!-- Node 1: React (at top y=110) -->
      <g transform="translate(210, 110)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#38BDF8" stroke-width="1.8"/>
          <text x="0" y="5.5" text-anchor="middle" font-size="15">⚛</text>
        </g>
      </g>

      <!-- Node 2: Node.js (at bottom y=290) -->
      <g transform="translate(210, 290)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#22C55E" stroke-width="1.8"/>
          <text x="0" y="5.5" text-anchor="middle" font-size="15">🟢</text>
        </g>
      </g>
    </g>

    <!-- ==================== ROTATING ORBIT 2 (MIDDLE - 28s CCW) ==================== -->
    <g transform="rotate(-28 210 200)">
      <animateTransform attributeName="transform" type="rotate" from="360 210 200" to="0 210 200" dur="28s" repeatCount="indefinite"/>

      <!-- Node 3: Next.js (at left x=72) -->
      <g transform="translate(72, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="28s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#FFFFFF" stroke-width="1.8"/>
          <text x="0" y="5.5" text-anchor="middle" fill="#FFFFFF" font-size="13">▲</text>
        </g>
      </g>

      <!-- Node 4: TypeScript (at right x=348) -->
      <g transform="translate(348, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="28s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#3178C6" stroke-width="1.8"/>
          <text x="0" y="4.5" text-anchor="middle" fill="#38BDF8" font-size="9.5" font-weight="900" class="font-mono">TS</text>
        </g>
      </g>
    </g>

    <!-- ==================== ROTATING ORBIT 3 (OUTER - 36s CW) ==================== -->
    <g transform="rotate(36 210 200)">
      <animateTransform attributeName="transform" type="rotate" from="0 210 200" to="360 210 200" dur="36s" repeatCount="indefinite"/>

      <!-- Node 5: Python (at top-left) -->
      <g transform="translate(45, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#FBBF24" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">🐍</text>
        </g>
      </g>

      <!-- Node 6: Docker (at top-right) -->
      <g transform="translate(375, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#38BDF8" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">🐳</text>
        </g>
      </g>

      <!-- Node 7: PostgreSQL (at bottom) -->
      <g transform="translate(210, 295)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#60A5FA" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">🐘</text>
        </g>
      </g>

      <!-- Node 8: GitHub Actions / CI -->
      <g transform="translate(210, 105)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#A855F7" stroke-width="1.6"/>
          <text x="0" y="4.5" text-anchor="middle" fill="#C084FC" font-size="8.5" font-weight="900" class="font-mono">CI</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="430" y1="24" x2="430" y2="376" stroke="#21262D" stroke-width="1"/>

  <!-- ==================== RIGHT: CATEGORIZED TECH ECOSYSTEM ==================== -->
  <g transform="translate(460, 32)">
    <text x="0" y="0" fill="#64748B" font-size="10.5" font-weight="700" class="font-mono">// ECOSYSTEM &amp; TECH STACK</text>
    <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900" class="font-sans">Planetary Technical Stack</text>

    <!-- Category 1: Frontend & Modern Web -->
    <g transform="translate(0, 48)">
      <text x="0" y="10" fill="#38BDF8" font-size="10.5" font-weight="700" class="font-mono">// FRONTEND &amp; MODERN WEB</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="75" height="26" class="cat-badge"/><text x="37" y="17" text-anchor="middle" class="cat-text">React</text></g>
        <g transform="translate(83, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Next.js</text></g>
        <g transform="translate(171, 0)" class="cat-group"><rect x="0" y="0" width="98" height="26" class="cat-badge"/><text x="49" y="17" text-anchor="middle" class="cat-text">TypeScript</text></g>
        <g transform="translate(277, 0)" class="cat-group"><rect x="0" y="0" width="85" height="26" class="cat-badge"/><text x="42" y="17" text-anchor="middle" class="cat-text">Tailwind</text></g>
        <g transform="translate(370, 0)" class="cat-group"><rect x="0" y="0" width="82" height="26" class="cat-badge"/><text x="41" y="17" text-anchor="middle" class="cat-text">Redux</text></g>
      </g>
    </g>

    <!-- Category 2: Backend & Languages -->
    <g transform="translate(0, 118)">
      <text x="0" y="10" fill="#A855F7" font-size="10.5" font-weight="700" class="font-mono">// BACKEND &amp; LANGUAGES</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="82" height="26" class="cat-badge"/><text x="41" y="17" text-anchor="middle" class="cat-text">Node.js</text></g>
        <g transform="translate(90, 0)" class="cat-group"><rect x="0" y="0" width="82" height="26" class="cat-badge"/><text x="41" y="17" text-anchor="middle" class="cat-text">Express</text></g>
        <g transform="translate(180, 0)" class="cat-group"><rect x="0" y="0" width="78" height="26" class="cat-badge"/><text x="39" y="17" text-anchor="middle" class="cat-text">Python</text></g>
        <g transform="translate(266, 0)" class="cat-group"><rect x="0" y="0" width="98" height="26" class="cat-badge"/><text x="49" y="17" text-anchor="middle" class="cat-text">JavaScript</text></g>
        <g transform="translate(372, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">REST APIs</text></g>
      </g>
    </g>

    <!-- Category 3: Databases & Cloud -->
    <g transform="translate(0, 188)">
      <text x="0" y="10" fill="#34D399" font-size="10.5" font-weight="700" class="font-mono">// DATABASES &amp; CLOUD</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="98" height="26" class="cat-badge"/><text x="49" y="17" text-anchor="middle" class="cat-text">PostgreSQL</text></g>
        <g transform="translate(106, 0)" class="cat-group"><rect x="0" y="0" width="84" height="26" class="cat-badge"/><text x="42" y="17" text-anchor="middle" class="cat-text">MongoDB</text></g>
        <g transform="translate(198, 0)" class="cat-group"><rect x="0" y="0" width="76" height="26" class="cat-badge"/><text x="38" y="17" text-anchor="middle" class="cat-text">Docker</text></g>
        <g transform="translate(282, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Supabase</text></g>
        <g transform="translate(370, 0)" class="cat-group"><rect x="0" y="0" width="82" height="26" class="cat-badge"/><text x="41" y="17" text-anchor="middle" class="cat-text">AWS Cloud</text></g>
      </g>
    </g>

    <!-- Category 4: Tooling & CI/CD -->
    <g transform="translate(0, 258)">
      <text x="0" y="10" fill="#F43F5E" font-size="10.5" font-weight="700" class="font-mono">// CI/CD &amp; TOOLING</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="126" height="26" class="cat-badge"/><text x="63" y="17" text-anchor="middle" class="cat-text">GitHub Actions</text></g>
        <g transform="translate(134, 0)" class="cat-group"><rect x="0" y="0" width="70" height="26" class="cat-badge"/><text x="35" y="17" text-anchor="middle" class="cat-text">Git / CI</text></g>
        <g transform="translate(212, 0)" class="cat-group"><rect x="0" y="0" width="78" height="26" class="cat-badge"/><text x="39" y="17" text-anchor="middle" class="cat-text">Postman</text></g>
        <g transform="translate(298, 0)" class="cat-group"><rect x="0" y="0" width="74" height="26" class="cat-badge"/><text x="37" y="17" text-anchor="middle" class="cat-text">Linux</text></g>
        <g transform="translate(380, 0)" class="cat-group"><rect x="0" y="0" width="72" height="26" class="cat-badge"/><text x="36" y="17" text-anchor="middle" class="cat-text">Jest/Vite</text></g>
      </g>
    </g>

    <!-- Footnote -->
    <g transform="translate(0, 330)">
      <line x1="0" y1="0" x2="465" y2="0" stroke="#1F242C" stroke-width="1"/>
      <text x="0" y="16" fill="#64748B" font-size="9.5" font-weight="600" class="font-mono">responsive web architecture • component systems • api pipelines</text>
    </g>
  </g>
</svg>
