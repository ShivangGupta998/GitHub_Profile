<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      .orbit-ring { fill: none; stroke: #30363D; stroke-width: 1.2; stroke-dasharray: 6 6; }
      
      /* Interactive Hover Effects */
      .cat-badge {
        rx: 5;
        fill: #161B22;
        stroke: #30363D;
        stroke-width: 1.2;
        transition: all 0.25s ease-in-out;
      }
      .cat-text {
        fill: #E2E8F0;
        font-size: 11px;
        font-weight: 600;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        transition: fill 0.25s ease-in-out;
        pointer-events: none;
      }
      .cat-group {
        cursor: pointer;
      }
      .cat-group:hover .cat-badge {
        fill: #1E2430;
        stroke: #38BDF8;
        stroke-width: 1.6;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
      }
      .cat-group:hover .cat-text {
        fill: #FFFFFF;
        font-weight: 800;
      }
      
      /* Hover on planet nodes */
      .planet-node {
        cursor: pointer;
      }
      .planet-node:hover circle {
        fill: #1E293B;
        stroke: #FFFFFF;
        stroke-width: 2.2;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
      }
    </style>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="958" height="398" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- ==================== LEFT: LIVE ANIMATED PLANETARY ORBITS ==================== -->
  <g transform="translate(0, 0)">
    <!-- Pulsing Ambient Radial Halo -->
    <circle cx="210" cy="200" r="145" fill="url(#coreGlow)">
      <animate attributeName="r" values="135;160;135" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit Track 1 (Inner: radius 90) -->
    <circle cx="210" cy="200" r="90" class="orbit-ring">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbit Track 2 (Middle: tilted -28°) -->
    <ellipse cx="210" cy="200" rx="138" ry="85" class="orbit-ring" transform="rotate(-28 210 200)">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbit Track 3 (Outer: tilted 36°) -->
    <ellipse cx="210" cy="200" rx="165" ry="95" class="orbit-ring" transform="rotate(36 210 200)">
      <animate attributeName="stroke-dashoffset" from="0" to="64" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbit Track 4 (Great Outer Sphere: radius 180) -->
    <circle cx="210" cy="200" r="180" class="orbit-ring" stroke="#21262D">
      <animate attributeName="stroke-dashoffset" from="64" to="0" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Central Glowing Core < / > with Pulsing Effect -->
    <circle cx="210" cy="200" r="38" fill="url(#coreGrad)" stroke="#BAE6FD" stroke-width="1.8" filter="url(#neonGlow)">
      <animate attributeName="r" values="37;42;37" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="210" y="207" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="900" class="font-mono">&lt; / &gt;</text>

    <!-- ==================== ROTATING ORBIT 1 (INNER - 20s CW) ==================== -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 210 200" to="360 210 200" dur="20s" repeatCount="indefinite"/>

      <!-- Node 1: Docker (at top y=110) -->
      <g transform="translate(210, 110)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#38BDF8" stroke-width="1.8"/>
          <text x="0" y="5.5" text-anchor="middle" font-size="15">🐳</text>
        </g>
      </g>

      <!-- Node 2: Kubernetes (at bottom y=290) -->
      <g transform="translate(210, 290)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#326CE5" stroke-width="1.8"/>
          <text x="0" y="4.5" text-anchor="middle" fill="#38BDF8" font-size="9" font-weight="900" class="font-mono">k8s</text>
        </g>
      </g>
    </g>

    <!-- ==================== ROTATING ORBIT 2 (MIDDLE - 28s CCW) ==================== -->
    <g transform="rotate(-28 210 200)">
      <animateTransform attributeName="transform" type="rotate" from="360 210 200" to="0 210 200" dur="28s" repeatCount="indefinite"/>

      <!-- Node 3: AWS (at left x=72) -->
      <g transform="translate(72, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="28s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#F97316" stroke-width="1.8"/>
          <text x="0" y="4" text-anchor="middle" fill="#F97316" font-size="9" font-weight="900" class="font-mono">AWS</text>
        </g>
      </g>

      <!-- Node 4: Terraform (at right x=348) -->
      <g transform="translate(348, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="28s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="17" fill="#161B22" stroke="#A855F7" stroke-width="1.8"/>
          <text x="0" y="5.5" text-anchor="middle" font-size="14">⬢</text>
        </g>
      </g>
    </g>

    <!-- ==================== ROTATING ORBIT 3 (OUTER - 36s CW) ==================== -->
    <g transform="rotate(36 210 200)">
      <animateTransform attributeName="transform" type="rotate" from="0 210 200" to="360 210 200" dur="36s" repeatCount="indefinite"/>

      <!-- Node 5: Python (at top-left) -->
      <g transform="translate(45, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#FBBF24" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">🐍</text>
        </g>
      </g>

      <!-- Node 6: Jenkins (at top-right) -->
      <g transform="translate(375, 200)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#EF4444" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">⚡</text>
        </g>
      </g>

      <!-- Node 7: Prometheus (at bottom) -->
      <g transform="translate(210, 295)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#F97316" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">📈</text>
        </g>
      </g>

      <!-- Node 8: Linux (at top) -->
      <g transform="translate(210, 105)" class="planet-node">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="16" fill="#161B22" stroke="#FBBF24" stroke-width="1.6"/>
          <text x="0" y="5" text-anchor="middle" font-size="14">🐧</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="430" y1="24" x2="430" y2="376" stroke="#21262D" stroke-width="1"/>

  <!-- ==================== RIGHT: CATEGORIZED TECH ECOSYSTEM ==================== -->
  <g transform="translate(460, 32)">
    <text x="0" y="0" fill="#64748B" font-size="10.5" font-weight="700" class="font-mono">// ECOSYSTEM &amp; TECH STACK</text>
    <text x="0" y="24" fill="#FFFFFF" font-size="20" font-weight="900" class="font-sans">DevOps &amp; Cloud Technical Stack</text>

    <!-- Category 1: Cloud & Containers -->
    <g transform="translate(0, 48)">
      <text x="0" y="10" fill="#38BDF8" font-size="10.5" font-weight="700" class="font-mono">// CLOUD &amp; CONTAINERS</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="75" height="26" class="cat-badge"/><text x="37" y="17" text-anchor="middle" class="cat-text">AWS</text></g>
        <g transform="translate(83, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Docker</text></g>
        <g transform="translate(171, 0)" class="cat-group"><rect x="0" y="0" width="102" height="26" class="cat-badge"/><text x="51" y="17" text-anchor="middle" class="cat-text">Kubernetes</text></g>
        <g transform="translate(281, 0)" class="cat-group"><rect x="0" y="0" width="94" height="26" class="cat-badge"/><text x="47" y="17" text-anchor="middle" class="cat-text">Terraform</text></g>
        <g transform="translate(383, 0)" class="cat-group"><rect x="0" y="0" width="75" height="26" class="cat-badge"/><text x="37" y="17" text-anchor="middle" class="cat-text">Ansible</text></g>
      </g>
    </g>

    <!-- Category 2: CI/CD & Automation -->
    <g transform="translate(0, 118)">
      <text x="0" y="10" fill="#A855F7" font-size="10.5" font-weight="700" class="font-mono">// CI/CD &amp; AUTOMATION</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="82" height="26" class="cat-badge"/><text x="41" y="17" text-anchor="middle" class="cat-text">Jenkins</text></g>
        <g transform="translate(90, 0)" class="cat-group"><rect x="0" y="0" width="124" height="26" class="cat-badge"/><text x="62" y="17" text-anchor="middle" class="cat-text">GitHub Actions</text></g>
        <g transform="translate(222, 0)" class="cat-group"><rect x="0" y="0" width="60" height="26" class="cat-badge"/><text x="30" y="17" text-anchor="middle" class="cat-text">Git</text></g>
        <g transform="translate(290, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Python</text></g>
        <g transform="translate(378, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Bash / CI</text></g>
      </g>
    </g>

    <!-- Category 3: Monitoring & Cloud Operations -->
    <g transform="translate(0, 188)">
      <text x="0" y="10" fill="#34D399" font-size="10.5" font-weight="700" class="font-mono">// OBSERVABILITY &amp; MONITORING</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="98" height="26" class="cat-badge"/><text x="49" y="17" text-anchor="middle" class="cat-text">Prometheus</text></g>
        <g transform="translate(106, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Grafana</text></g>
        <g transform="translate(194, 0)" class="cat-group"><rect x="0" y="0" width="96" height="26" class="cat-badge"/><text x="48" y="17" text-anchor="middle" class="cat-text">CloudWatch</text></g>
        <g transform="translate(298, 0)" class="cat-group"><rect x="0" y="0" width="76" height="26" class="cat-badge"/><text x="38" y="17" text-anchor="middle" class="cat-text">Linux</text></g>
        <g transform="translate(382, 0)" class="cat-group"><rect x="0" y="0" width="76" height="26" class="cat-badge"/><text x="38" y="17" text-anchor="middle" class="cat-text">Jira</text></g>
      </g>
    </g>

    <!-- Category 4: Testing & Methodology -->
    <g transform="translate(0, 258)">
      <text x="0" y="10" fill="#F43F5E" font-size="10.5" font-weight="700" class="font-mono">// QUALITY, PROTOCOLS &amp; METHODS</text>
      <g transform="translate(0, 18)">
        <g transform="translate(0, 0)" class="cat-group"><rect x="0" y="0" width="112" height="26" class="cat-badge"/><text x="56" y="17" text-anchor="middle" class="cat-text">Automation QA</text></g>
        <g transform="translate(120, 0)" class="cat-group"><rect x="0" y="0" width="85" height="26" class="cat-badge"/><text x="42" y="17" text-anchor="middle" class="cat-text">CANoe / CAN</text></g>
        <g transform="translate(213, 0)" class="cat-group"><rect x="0" y="0" width="82" height="26" class="cat-badge"/><text x="41" y="17" text-anchor="middle" class="cat-text">ITIL 4 / IaC</text></g>
        <g transform="translate(303, 0)" class="cat-group"><rect x="0" y="0" width="80" height="26" class="cat-badge"/><text x="40" y="17" text-anchor="middle" class="cat-text">Agile SDLC</text></g>
        <g transform="translate(391, 0)" class="cat-group"><rect x="0" y="0" width="67" height="26" class="cat-badge"/><text x="33" y="17" text-anchor="middle" class="cat-text">ISO 26262</text></g>
      </g>
    </g>

    <!-- Footnote -->
    <g transform="translate(0, 330)">
      <line x1="0" y1="0" x2="465" y2="0" stroke="#1F242C" stroke-width="1"/>
      <text x="0" y="16" fill="#64748B" font-size="9.5" font-weight="600" class="font-mono">aws cloud provisioning • kubernetes cluster management • 88% automation efficiency</text>
    </g>
  </g>
</svg>
