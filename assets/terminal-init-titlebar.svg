<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 40" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .live-dot { animation: pulseGlow 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Titlebar Container -->
  <path d="M 0 12 Q 0 0 12 0 L 948 0 Q 960 0 960 12 L 960 40 L 0 40 Z" fill="#161B22"/>
  <line x1="0" y1="39.5" x2="960" y2="39.5" stroke="#30363D" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="39" cy="20" r="5.5" fill="#FFBD2E"/>
  <circle cx="56" cy="20" r="5.5" fill="#27C93F"/>

  <!-- Left Window Title -->
  <text x="80" y="24" fill="#C9D1D9" font-size="12" font-weight="600" class="font-mono">shivang@dev:~ (bash)</text>

  <!-- Right Live Terminal Indicator -->
  <g transform="translate(940, 24)" text-anchor="end">
    <circle cx="-106" cy="-4" r="4" fill="#34D399" class="live-dot"/>
    <text x="0" y="0" fill="#34D399" font-size="11" font-weight="700" letter-spacing="0.5" class="font-mono">● LIVE TERMINAL</text>
  </g>
</svg>
