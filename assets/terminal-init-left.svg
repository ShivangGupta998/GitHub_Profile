<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
      @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: cursorBlink 0.9s infinite steps(1); }
      .prompt-label { fill: #8B949E; font-size: 12.5px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
      .prompt-cmd { fill: #F0F6FC; font-size: 12.5px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Left Terminal Container Background -->
  <rect width="460" height="360" fill="#0D1117"/>

  <!-- Command Sequence -->
  <g transform="translate(24, 28)">
    <!-- Command 1: whoami -->
    <text x="0" y="0" class="prompt-label">shivang@dev:~$ <tspan class="prompt-cmd">whoami</tspan></text>
    <text x="0" y="22" fill="#38BDF8" font-size="14.5" font-weight="800" class="font-sans">Shivang Gupta</text>

    <!-- Command 2: cat about.md -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" class="prompt-label">shivang@dev:~$ <tspan class="prompt-cmd">cat about.md</tspan></text>
      <text x="0" y="24" fill="#FFFFFF" font-size="14.5" font-weight="700" class="font-sans">Hello, World! 👋 I'm Shivang Gupta.</text>
      <text x="0" y="44" fill="#94A3B8" font-size="11.5" font-weight="500" class="font-mono">Full-Stack Web Developer  •  React &amp; Next.js</text>
      <text x="0" y="60" fill="#94A3B8" font-size="11.5" font-weight="500" class="font-mono">TypeScript &amp; Cloud Architecture</text>
    </g>

    <!-- Command 3: ./initialize.sh -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="prompt-label">shivang@dev:~$ <tspan class="prompt-cmd">./initialize.sh</tspan></text>
      <g transform="translate(0, 20)">
        <!-- Animated / Glowing Progress Bar -->
        <rect x="0" y="0" width="220" height="14" rx="4" fill="#1C182B" stroke="#6B21A8" stroke-width="0.8"/>
        <rect x="0" y="0" width="220" height="14" rx="4" fill="#A855F7"/>
        <text x="230" y="11" fill="#C084FC" font-size="11" font-weight="800" class="font-mono">100%</text>

        <!-- Status Responses -->
        <text x="0" y="32" fill="#34D399" font-size="11.5" font-weight="700" class="font-mono">[OK] Profile initialized.</text>
        <text x="0" y="50" fill="#34D399" font-size="11.5" font-weight="700" class="font-mono">[OK] Systems ready.</text>
        <text x="0" y="68" fill="#38BDF8" font-size="11.5" font-weight="700" class="font-mono">[OK] Full-Stack Matrix linked.</text>
        
        <!-- Blinking Prompt Line at End -->
        <g transform="translate(0, 94)">
          <text x="0" y="0" class="prompt-label">shivang@dev:~$ <tspan fill="#34D399" font-weight="700">./deploy</tspan></text>
          <rect x="156" y="-11" width="8" height="14" fill="#34D399" class="cursor"/>
        </g>
      </g>
    </g>
  </g>
</svg>
