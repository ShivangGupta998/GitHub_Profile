<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 48" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Top Window Title Bar -->
  <path d="M 2 46 L 2 14 Q 2 2 14 2 L 986 2 Q 998 2 998 14 L 998 46 Z" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>

  <!-- Left Black Terminal Tab -->
  <g transform="translate(12, 8)">
    <rect x="0" y="0" width="285" height="30" rx="6" fill="#111111"/>
    <!-- 3 Window Control Circles -->
    <circle cx="16" cy="15" r="4.5" fill="#FFFFFF"/>
    <circle cx="29" cy="15" r="4.5" fill="#555555"/>
    <circle cx="42" cy="15" r="4.5" fill="#555555"/>
    <!-- Tab Command Text -->
    <text x="58" y="19.5" fill="#F5F5F5" font-size="11.5" font-weight="600" class="font-mono">ShivangGupta998@github:~$ whoami</text>
  </g>

  <!-- Center Navigation Tags -->
  <g transform="translate(390, 27)" text-anchor="middle" fill="#666666" font-size="10.5" font-weight="600" class="font-mono">
    <text x="0" y="0">[ 01_HOME ]</text>
    <text x="85" y="0">[ 02-PROJECTS ]</text>
    <text x="175" y="0">[ 03_SKILLS ]</text>
    <text x="255" y="0">[ 04_STATS ]</text>
    <text x="340" y="0">[ 05_CONTACT ]</text>
  </g>

  <!-- Right Metadata (Date, Wifi, Battery) -->
  <g transform="translate(900, 20)">
    <line x1="-100" y1="-8" x2="-100" y2="18" stroke="#E5E5E5" stroke-width="1"/>
    <!-- System Date -->
    <text x="-85" y="7" fill="#666666" font-size="10.5" class="font-mono">Fri, 02 Oct 2026  21:30</text>
    <!-- Wifi Icon -->
    <path d="M 62 8 A 6 6 0 0 1 74 8 M 65 5 A 10 10 0 0 1 71 5 M 68 2 A 14 14 0 0 1 68 2" fill="none" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="68" cy="10" r="1.2" fill="#222222"/>
    <!-- Battery Icon -->
    <rect x="80" y="1" width="16" height="9" rx="2" fill="none" stroke="#222222" stroke-width="1.2"/>
    <rect x="82" y="3" width="10" height="5" rx="1" fill="#222222"/>
    <path d="M 96 3 L 98 3 L 98 7 L 96 7 Z" fill="#222222"/>
  </g>
</svg>
